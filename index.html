<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://img5.pic.in.th/file/secure-sv1/Logo463bb4b450154ca8.png">
  <title>รับสมัครห้องเรียนพิเศษนิติศาสตร์-รัฐศาสตร์ 2569</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  
  
  <style>
    body { 
      font-family: 'Itim', sans-serif;
      background: linear-gradient(90deg, #841111 0%, #a10c0c 100%); 
    }

    .header-banner { 
        color: white; 
        padding: 20px 0; 
    }

    .stat-box {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stat-number { 
        font-size: 1.5rem; 
        font-weight: bold; 
        color: #ffc107; 
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-top: -30px;
    }

    .btn-submit { 
        background-color: #0d2546; 
        color: white; 
        width: 100%; 
    }

    .btn-submit:hover { 
        background-color: #1e3c72; 
        color: white; 
    }

    .black-ribbon { 
        position: fixed; 
        z-index: 9999; 
        width: 70px; }

    @media only all and (min-width: 768px) { 
        .black-ribbon { 
            width: auto; 
        } 
    }

    .stick-left { left: 0; }
    .stick-right { right: 0; }
    .stick-top { top: 0; }
    .stick-bottom { bottom: 0; }

    .error-text { 
        color: #dc3545; 
        font-size: 0.875em; 
        display: none; 
        margin-top: 5px; 
    }
    .rainbow-text {
    background: linear-gradient(
      90deg, 
      #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000
    );
    background-size: 400%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important; 
    animation: rainbow-move 15s linear infinite;
    font-weight: bold; 
    text-shadow: 1px 1px 10px rgba(255, 255, 255, .3);
  }

  @keyframes rainbow-move {
    0% { background-position: 0%; }
    100% { background-position: 400%; }
  }
  </style>
</head>

<body>
  <img src="https://img5.pic.in.th/file/secure-sv1/black_ribbon_top_leftb3f64429b2018298.png" class="black-ribbon stick-top stick-left"/>
  <div style="text-align: center; margin: 20px 0;">
    <img src="https://img5.pic.in.th/file/secure-sv1/Logo463bb4b450154ca8.png" 
    alt="Logo ห้องเรียน" 
    style="width: 150px; height: auto;">
  </div>

  <div class="header-banner">
    <div class="container">
      <h2 class="text-center mb-4">⚖️ รับสมัครห้องเรียนพิเศษนิติศาสตร์-รัฐศาสตร์ ประจำปีการศึกษา 2569</h2>
      <h3 class="text-center mb-4">รับสมัคร 9 - 13 กุมภาพันธ์ 2569 สอบคัดเลือก 22 กุมภาพันธ์ 2569</h3>
      <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="row">
                <div class="col-4">
                    <div class="stat-box">
                        <small>ชาย</small>
                        <div id="maleCount" class="stat-number">-</div>
                    </div>
                </div>
        
                <div class="col-4">
                    <div class="stat-box"><small>หญิง</small>
                        <div id="femaleCount" class="stat-number">-</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="stat-box" style="background: rgba(255,193,7,0.2); border-color: #ffc107;"><small>รวม</small>
                        <div id="totalCount" class="stat-number">-</div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    <h1 class="text-center mt-4"><span id="currentDateDisplay" class="text-warning fw-bold">...</span></h1>
    <p class="text-center mt-3 mb-2" style="opacity: 0.9;">
        <small>*ข้อมูลอัปเดตแบบ Real-time</small>
    </p>
    </div>
  </div>

  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="form-container">
          <h4 class="mb-4 text-center">แบบฟอร์มลงทะเบียน</h4>
          
          <form id="appForm" onsubmit="handleFormSubmit(this)" autocomplete="off">
            
            <div class="mb-3">
              <label class="form-label">เลขที่สมัคร</label>
              <input type="text" class="form-control" name="num_S" required placeholder="ระบุเลขที่สมัคร (เช่น 45001)" maxlength="5">
            </div>

            <div class="mb-3">
              <label class="form-label">ที่อยู่อีเมล</label>
              <input type="email" class="form-control" name="email_S" required placeholder="example@gmail.com">
            </div>

            <div class="mb-3">
              <label class="form-label">เลขประจำตัวประชาชน</label>
              <input type="text" id="idCard" class="form-control" name="ID_S" 
                     required placeholder="x-xxxx-xxxxx-xx-x" 
                     maxlength="17" 
                     oninput="formatIdCard(this)">
              <div id="id-error" class="error-text">เลขประจำตัวประชาชนไม่ถูกต้อง</div>
            </div>

            <div class="mb-3">
              <label class="form-label">คำนำหน้า</label>
              <select class="form-select" name="name_T" required>
                <option value="" selected disabled>ระบุคำนำหน้า...</option>
                <option value="เด็กชาย">เด็กชาย</option>
                <option value="เด็กหญิง">เด็กหญิง</option>
                <option value="นาย">นาย</option>
                <option value="นางสาว">นางสาว</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">ชื่อ-นามสกุล นักเรียน</label>
              <input type="text" class="form-control" name="name_S" required placeholder="ระบุชื่อไม่ต้องใส่คำนำหน้า">
            </div>

            <div class="mb-3">
              <label class="form-label">ชั้น</label>
              <input type="text" class="form-control" name="class_S" required placeholder="ระบุชั้น เช่น ม.3/12">
            </div>

            <div class="mb-3">
              <label class="form-label">โรงเรียน</label>
              <input type="text" class="form-control" name="school_S" required placeholder="ระบุโรงเรียน เช่น สตรีสิริเกศ">
            </div>

            <div class="mb-3">
              <label class="form-label">เบอร์โทรศัพท์</label>
              <input type="text" class="form-control" name="phone_S" required placeholder="ระบุเบอร์โทรศัพท์ เช่น 08x-xxx-xxxx" maxlength="10">
            </div>

            <div class="mb-3">
              <label class="form-label">ชื่อ-นามสกุล ผู้ปกครอง</label>
              <input type="text" class="form-control" name="name_P" required placeholder="ระบุชื่อผู้ปกครอง">
            </div>

            <div class="mb-3">
              <label class="form-label">เบอร์โทรศัพท์ ผู้ปกครอง</label>
              <input type="text" class="form-control" name="phone_P" required placeholder="ระบุเบอร์โทรศัพท์ผู้ปกครอง" maxlength="10">
            </div>

            <div class="mb-3">
              <label class="form-label">ความสัมพันธ์</label>
              <input type="text" class="form-control" name="Relas" required placeholder="ระบุความสัมพันธ์ เช่น บิดา">
            </div>

            <button type="submit" class="btn btn-submit py-2">ยืนยันการสมัคร</button>
          </form>
          <div id="message" class="mt-3 text-center" style="display:none;"></div>
        </div>
      </div>
      <p class="text-center mt-3 mb-1" style="opacity: 1; font-size: 1.2rem;">
        <small class="rainbow-text">Developed by LAPSBOY</small>
      </p>
    </div>
  </div>
  

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxUQ7PcKf7DRtTLECMAqX1xhzGtDqppquzB4bQIZXSXZHfqhc5YCSPx6u1BUgRXdLOO/exec'; 

    window.onload = function() { 
      checkOpenTime(); 
      displayCurrentDate(); 
      fetchStats(); 
    };
  
    function checkOpenTime() {
      var now = new Date();
      var start = new Date("2026-02-09T07:00:00+07:00");
      var end   = new Date("2026-06-30T23:59:59+07:00");

      if (now < start || now > end) {
         var msg = now < start ? "🚫 ระบบยังไม่เปิดรับสมัคร จะเปิดรับสมัครในวันที่ 9 กุมภาพันธ์ 2569 เวลา 07:00 น." : "⛔ หมดเขตรับสมัครแล้ว ปิดรับสมัครเมื่อวันที่ 13 กุมภาพันธ์ 2569 เวลา 16:30 น.";
         document.body.innerHTML = `<img src="https://img5.pic.in.th/file/secure-sv1/black_ribbon_top_leftb3f64429b2018298.png" class="black-ribbon stick-top stick-left"/>
         <div style="background:#a10c0c; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white;">
            <img src="https://img5.pic.in.th/file/secure-sv1/Logo463bb4b450154ca8.png" style="width: 150px; margin-bottom:20px;">
            <h1 style="font-family:'Itim',sans-serif; text-align:center; padding:20px;">${msg}</h1>
            <p style="opacity:0.8;">Develop By LAPSBOY</p>
         </div>`;
      }
    }

    function displayCurrentDate() {
      var date = new Date();
      document.getElementById('currentDateDisplay').innerText = "วันที่ " + date.toLocaleDateString('th-TH', {year: 'numeric', month: 'long', day: 'numeric'});
    }

    function fetchStats() {
      fetch(GAS_URL + '?action=getStats&t=' + new Date().getTime()) 
        .then(response => response.json())
        .then(stats => {
           document.getElementById('maleCount').innerText = stats.male;
           document.getElementById('femaleCount').innerText = stats.female;
           document.getElementById('totalCount').innerText = stats.total;
        })
        .catch(error => console.error('Error loading stats:', error));
    }

    function formatIdCard(input) {
        let value = input.value.replace(/[^0-9]/g, '');
        let formatted = '';
        if (value.length > 0) formatted += value.substring(0, 1);
        if (value.length > 1) formatted += '-' + value.substring(1, 5);
        if (value.length > 5) formatted += '-' + value.substring(5, 10);
        if (value.length > 10) formatted += '-' + value.substring(10, 12);
        if (value.length > 12) formatted += '-' + value.substring(12, 13);
        input.value = formatted;
        document.getElementById('id-error').style.display = 'none';
    }

    function checkScriptTh(id) {
        if(id.length != 13) return false;
        let sum = 0;
        for(let i=0; i < 12; i++) sum += parseFloat(id.charAt(i)) * (13 - i);
        return (11 - sum % 11) % 10 == parseFloat(id.charAt(12));
    }

    function handleFormSubmit(form) {
      event.preventDefault();
      
      const idInput = document.getElementById('idCard');
      const plainID = idInput.value.replace(/[^0-9]/g, '');
      if (!checkScriptTh(plainID)) {
          alert('เลขประจำตัวประชาชนไม่ถูกต้อง');
          document.getElementById('id-error').style.display = 'block';
          idInput.focus();
          return;
      }

      var btn = form.querySelector('button');
      var originalText = btn.innerText;
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";
      document.getElementById('message').style.display = 'none';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      data.ID_S = plainID;

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(result => {
         if (result.success) {
            form.reset();
            document.getElementById('message').innerText = "✅ " + result.message;
            document.getElementById('message').style.display = "block";
            document.getElementById('message').className = "mt-3 text-center text-success fw-bold";
            fetchStats();
         } else {
            alert(result.message);
         }
      })
      .catch(error => {
         console.error('Error:', error);
         alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
      })
      .finally(() => {
         btn.disabled = false;
         btn.innerText = originalText;
      });
    }

  </script>
</body>

</html>
